# Messages in English. ADR 0023. Keys must match messages.properties exactly.
# {0}, {1}: exception arguments. {max}, {value}: validation annotation attributes.
# Avoid apostrophes: in messages with arguments they are special characters (MessageFormat).

# ---------------------------------------------------------------- validation: resident
morador.nome.obrigatorio=the name is required
morador.nome.tamanho-maximo=must have at most {max} characters
morador.email.obrigatorio=the email is required
morador.email.invalido=must be a valid email address
morador.email.tamanho-maximo=must have at most {max} characters
morador.fone.tamanho-maximo=must have at most {max} characters

# ---------------------------------------------------------------- validation: pagination
paginacao.page.minimo=must be greater than or equal to {value}
paginacao.size.minimo=must be greater than or equal to {value}
paginacao.size.maximo=must be at most {value}

# ---------------------------------------------------------------- resident rules
erro.morador.email-repetido=A resident with this email is already registered.
erro.morador.nao-encontrado=Resident not found.
erro.morador.listar-somente-administrador=Only the administrator can list residents.
erro.morador.situacao-somente-administrador=Only the administrator can change the status of a resident.
erro.morador.acesso-proprio-cadastro=A resident can only access their own record.
erro.morador.usuario-inexistente-ou-inativo=User does not exist or is inactive.
erro.morador.operador-sem-acesso=The operator cannot access resident records.

# ---------------------------------------------------------------- actor identification (ADR 0019)
erro.ator.cabecalho-ausente=Provide the {0} header.
erro.ator.perfil-invalido=Invalid profile. Use MORADOR, OPERADOR or ADMINISTRADOR.
erro.ator.usuario-id-invalido=The {0} header must be a number.

# ---------------------------------------------------------------- general messages (global handler)
erro.geral.dados-invalidos=Invalid data.
erro.geral.json-ilegivel=Invalid data. Check that the JSON is complete and well formed.
erro.geral.valor-invalido=Invalid value. Accepted values: {0}.
erro.geral.valor-invalido-campo=invalid value
erro.geral.parametro-invalido=Invalid parameter.
erro.geral.parametro-ausente=Missing parameter.
erro.geral.parametro-obrigatorio=the parameter is required
erro.geral.recurso-nao-encontrado=Resource not found.
erro.geral.registro-alterado=The record was changed by another operation. Reload and try again.
erro.geral.violacao-integridade=The submitted data violates an integrity rule.
erro.geral.metodo-nao-suportado=HTTP method not supported for this resource.
erro.geral.tipo-nao-suportado=Unsupported content type. Use application/json.
erro.geral.erro-interno=Internal error. Try again later.

# ---------------------------------------------------------------- validation: address (RF02)
endereco.logradouro.obrigatorio=the street is required
endereco.logradouro.tamanho-maximo=must have at most {max} characters
endereco.numero.obrigatorio=the number is required (use S/N when there is none)
endereco.numero.tamanho-maximo=must have at most {max} characters
endereco.bairro.obrigatorio=the neighborhood is required
endereco.bairro.tamanho-maximo=must have at most {max} characters
endereco.municipio.obrigatorio=the city is required
endereco.municipio.tamanho-maximo=must have at most {max} characters
endereco.uf.obrigatorio=the state is required
endereco.uf.formato=must have two uppercase letters
endereco.cep.obrigatorio=the postal code is required
endereco.cep.formato=must have eight digits, without mask
endereco.complemento.tamanho-maximo=must have at most {max} characters

# ---------------------------------------------------------------- address rules
erro.endereco.nao-encontrado=Address not found for this resident.

# ---------------------------------------------------------------- validation: material (RF03)
material.nome.obrigatorio=the name is required
material.nome.tamanho-maximo=must have at most {max} characters
material.descricao.obrigatoria=the description is required
material.descricao.tamanho-maximo=must have at most {max} characters
material.unidade.obrigatoria=the unit is required
material.orientacao.obrigatoria=the preparation guidance is required
material.orientacao.tamanho-maximo=must have at most {max} characters

# ---------------------------------------------------------------- material rules
erro.material.nome-repetido=A material with this name already exists.
erro.material.nao-encontrado=Material not found.
erro.material.somente-administrador=Only the administrator can create and update materials.
erro.material.unidade-bloqueada=The unit cannot be changed: the material already has a request item or is linked to a collection point.
