# Mensagens em português do Brasil (idioma padrão). ADR 0023.
# Convenção das chaves (iguais em messages_en.properties):
#   <recurso>.<campo>.<regra>      validação de campo     (ex.: morador.nome.obrigatorio)
#   erro.<recurso>.<situacao>      regra de negócio       (ex.: erro.morador.email-repetido)
#   erro.geral.<situacao>          mensagens genéricas do tratador global
# {0}, {1}: argumentos das exceções. {max}, {value}: atributos da anotação de validação.

# ---------------------------------------------------------------- validação: morador
morador.nome.obrigatorio=o nome é obrigatório
morador.nome.tamanho-maximo=deve ter no máximo {max} caracteres
morador.email.obrigatorio=o e-mail é obrigatório
morador.email.invalido=deve ser um endereço de e-mail válido
morador.email.tamanho-maximo=deve ter no máximo {max} caracteres
morador.fone.tamanho-maximo=deve ter no máximo {max} caracteres

# ---------------------------------------------------------------- validação: paginação
paginacao.page.minimo=deve ser maior ou igual a {value}
paginacao.size.minimo=deve ser maior ou igual a {value}
paginacao.size.maximo=deve ser no máximo {value}

# ---------------------------------------------------------------- regras do morador
erro.morador.email-repetido=Já existe um morador cadastrado com este e-mail.
erro.morador.nao-encontrado=Morador não encontrado.
erro.morador.listar-somente-administrador=Apenas o administrador pode listar moradores.
erro.morador.situacao-somente-administrador=Apenas o administrador pode alterar a situação do morador.
erro.morador.acesso-proprio-cadastro=O morador só pode acessar o próprio cadastro.
erro.morador.usuario-inexistente-ou-inativo=Usuário inexistente ou inativo.
erro.morador.operador-sem-acesso=O operador não pode acessar cadastros de moradores.

# ---------------------------------------------------------------- identificação do ator (ADR 0019)
erro.ator.cabecalho-ausente=Informe o cabeçalho {0}.
erro.ator.perfil-invalido=Perfil inválido. Use MORADOR, OPERADOR ou ADMINISTRADOR.
erro.ator.usuario-id-invalido=O cabeçalho {0} deve ser um número.

# ---------------------------------------------------------------- mensagens gerais (tratador global)
erro.geral.dados-invalidos=Dados inválidos.
erro.geral.json-ilegivel=Dados inválidos. Verifique se o JSON está completo e bem formado.
erro.geral.valor-invalido=Valor inválido. Valores aceitos: {0}.
erro.geral.valor-invalido-campo=valor inválido
erro.geral.parametro-invalido=Parâmetro inválido.
erro.geral.parametro-ausente=Parâmetro ausente.
erro.geral.parametro-obrigatorio=o parâmetro é obrigatório
erro.geral.recurso-nao-encontrado=Recurso não encontrado.
erro.geral.registro-alterado=O registro foi alterado por outra operação. Recarregue e tente novamente.
erro.geral.violacao-integridade=Os dados informados violam uma regra de integridade.
erro.geral.metodo-nao-suportado=Método HTTP não suportado para este recurso.
erro.geral.tipo-nao-suportado=Tipo de conteúdo não suportado. Use application/json.
erro.geral.erro-interno=Erro interno. Tente novamente mais tarde.

# ---------------------------------------------------------------- validação: endereço (RF02)
endereco.logradouro.obrigatorio=o logradouro é obrigatório
endereco.logradouro.tamanho-maximo=deve ter no máximo {max} caracteres
endereco.numero.obrigatorio=o número é obrigatório (use S/N quando não houver)
endereco.numero.tamanho-maximo=deve ter no máximo {max} caracteres
endereco.bairro.obrigatorio=o bairro é obrigatório
endereco.bairro.tamanho-maximo=deve ter no máximo {max} caracteres
endereco.municipio.obrigatorio=o município é obrigatório
endereco.municipio.tamanho-maximo=deve ter no máximo {max} caracteres
endereco.uf.obrigatorio=a UF é obrigatória
endereco.uf.formato=deve ter duas letras maiúsculas
endereco.cep.obrigatorio=o CEP é obrigatório
endereco.cep.formato=deve ter oito dígitos, sem máscara
endereco.complemento.tamanho-maximo=deve ter no máximo {max} caracteres

# ---------------------------------------------------------------- regras do endereço
erro.endereco.nao-encontrado=Endereço não encontrado para este morador.

# ---------------------------------------------------------------- validação: material (RF03)
material.nome.obrigatorio=o nome é obrigatório
material.nome.tamanho-maximo=deve ter no máximo {max} caracteres
material.descricao.obrigatoria=a descrição é obrigatória
material.descricao.tamanho-maximo=deve ter no máximo {max} caracteres
material.unidade.obrigatoria=a unidade é obrigatória
material.orientacao.obrigatoria=a orientação de preparo é obrigatória
material.orientacao.tamanho-maximo=deve ter no máximo {max} caracteres

# ---------------------------------------------------------------- regras do material
erro.material.nome-repetido=Já existe um material com este nome.
erro.material.nao-encontrado=Material não encontrado.
erro.material.somente-administrador=Apenas o administrador pode cadastrar e atualizar materiais.
erro.material.unidade-bloqueada=A unidade não pode ser alterada: o material já tem item de solicitação ou vínculo com ponto de coleta.

# ---------------------------------------------------------------- validação: ponto de coleta (RF04)
ponto.nome.obrigatorio=o nome é obrigatório
ponto.nome.tamanho-maximo=deve ter no máximo {max} caracteres
ponto.contato.tamanho-maximo=deve ter no máximo {max} caracteres
ponto.horarios.tamanho-maximo=deve ter no máximo {max} caracteres
ponto.endereco.obrigatorio=o endereço é obrigatório

# ---------------------------------------------------------------- regras do ponto de coleta
erro.ponto.nao-encontrado=Ponto de coleta não encontrado.
erro.ponto.somente-administrador=Apenas o administrador pode cadastrar e atualizar pontos de coleta.

# ---------------------------------------------------------------- vínculo ponto-material (RF05)
vinculo.observacoes.tamanho-maximo=deve ter no máximo {max} caracteres
vinculo.limite.minimo=deve ser maior que zero
vinculo.limite.formato=deve ter no máximo {integer} dígitos inteiros e {fraction} casas decimais
erro.vinculo.nao-encontrado=Vínculo entre o ponto de coleta e o material não encontrado.
erro.vinculo.somente-administrador=Apenas o administrador pode vincular e desvincular materiais dos pontos de coleta.
