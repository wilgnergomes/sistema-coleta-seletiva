# Mensagens em português do Brasil (idioma padrão). ADR 0023.
# Convenção das chaves (iguais em messages_en.properties):
#   <recurso>.<campo>.<regra>      validação de campo     (ex.: morador.nome.obrigatorio)
#   erro.<recurso>.<situacao>      regra de negócio       (ex.: erro.morador.email-repetido)
#   erro.geral.<situacao>          mensagens genéricas do tratador global
# {0}, {1}: argumentos das exceções. {max}, {value}: atributos da anotação de validação.

# ---------------------------------------------------------------- validação: morador
morador.nome.obrigatorio=o nome é obrigatório
morador.nome.tamanho-maximo=deve ter no máximo {max} caracteres
morador.email.obrigatorio=o e-mail é obrigatório
morador.email.invalido=deve ser um endereço de e-mail válido
morador.email.tamanho-maximo=deve ter no máximo {max} caracteres
morador.fone.tamanho-maximo=deve ter no máximo {max} caracteres

# ---------------------------------------------------------------- validação: paginação
paginacao.page.minimo=deve ser maior ou igual a {value}
paginacao.size.minimo=deve ser maior ou igual a {value}
paginacao.size.maximo=deve ser no máximo {value}

