# Nome da aplicação
spring.application.name=coleta-seletiva

# Lê o .env da raiz do projeto, se existir
spring.config.import=optional:file:.env[.properties]

# Conexão com o PostgreSQL usando as variáveis do .env e direcionando para o schema 'coleta'
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}?currentSchema=coleta
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O esquema pertence às migrações do Flyway; o Hibernate apenas valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=coleta

# Configuração do Flyway controlando o schema dedicado
spring.flyway.enabled=true
spring.flyway.schemas=coleta